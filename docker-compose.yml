services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metadosis}
      POSTGRES_USER: ${POSTGRES_USER:-metadosis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metadosis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - metadosis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metadosis} -d ${POSTGRES_DB:-metadosis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metadosis-postgres-data:
